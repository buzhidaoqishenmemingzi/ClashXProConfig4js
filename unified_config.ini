[custom]
enable_rule_generator=true
overwrite_original_rules=true

;=============================================
; 策略组
; 用法：任意机场订阅 + subconverter + 本配置
;=============================================
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选优`[]DIRECT`.*
custom_proxy_group=♻️ 自动选优`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🤖 AI 服务`select`[]🚀 节点选择`[]♻️ 自动选优`[]DIRECT`.*
custom_proxy_group=📺 流媒体`select`[]🚀 节点选择`[]♻️ 自动选优`[]DIRECT`.*
custom_proxy_group=💬 Telegram`select`[]🚀 节点选择`[]♻️ 自动选优`.*
custom_proxy_group=🐦 Twitter/X`select`[]🚀 节点选择`[]♻️ 自动选优`.*
custom_proxy_group=👨‍💻 开发工具`select`[]🚀 节点选择`[]♻️ 自动选优`[]DIRECT`.*
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🪟 微软服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选优`.*
custom_proxy_group=🛡️ 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选优

;=============================================
; 规则（按优先级从高到低排列）
;=============================================

; ---- 1. 自定义规则（最高优先级，勿动）----
ruleset=DIRECT,https://raw.githubusercontent.com/buzhidaoqishenmemingzi/ClashXProConfig4js/master/custom_rules/custom_direct.yaml
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/buzhidaoqishenmemingzi/ClashXProConfig4js/master/custom_rules/custom_ai.yaml
ruleset=🚀 节点选择,https://raw.githubusercontent.com/buzhidaoqishenmemingzi/ClashXProConfig4js/master/custom_rules/custom_proxy.yaml

; ---- 2. 局域网直连 ----
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; ---- 3. 广告屏蔽 ----
;常见广告关键字、广告联盟，无副作用
ruleset=🛡️ 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
;常用应用去广告规则，轻微副作用
ruleset=🛡️ 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
;AdblockPlus 中国区屏蔽域名
ruleset=🛡️ 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list
;Loyalsoldier 补充广告域名
surge_ruleset=🛡️ 广告拦截,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt

; ---- 4. AI 服务 ----
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list

; ---- 5. 流媒体 ----
ruleset=📺 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=📺 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=📺 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list
ruleset=📺 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
;ACL4SSR 兜底：覆盖其余国外流媒体
ruleset=📺 流媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; ---- 6. 社交 ----
ruleset=💬 Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🐦 Twitter/X,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list

; ---- 7. 开发工具（走代理）----
ruleset=👨‍💻 开发工具,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=👨‍💻 开发工具,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Atlassian/Atlassian.list

; ---- 8. 苹果服务（默认直连，可切代理）----
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; ---- 9. 微软服务（默认直连）----
ruleset=🪟 微软服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list

; ---- 10. 游戏平台（默认直连，海外游戏可切代理）----
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Epic/Epic.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Game.list

; ---- 11. 国内直连 ----
;谷歌中国可直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
;国内常用域名
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
;国内云服务商 IP 段
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
;国内 IP 段（IPIP 数据源）
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
;下载域名直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

; ---- 12. 代理（GFW 域名）----
;GFW 全量列表
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
;精简代理列表 + 被污染域名
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; ---- 13. 兜底：漏网之鱼 ----
ruleset=🐟 漏网之鱼,[]FINAL

[template]
clash.dns=0
